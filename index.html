<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>DJ Bar — Đăng nhập</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;font-family:system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at 50% 20%,#1a0a2e 0%,#06040c 70%);
  color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;
}
.box{
  width:min(400px,100%);background:rgba(255,255,255,.05);
  border:1px solid rgba(180,80,255,.3);border-radius:18px;padding:28px 24px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
h1{font-size:24px;text-align:center;margin-bottom:6px;
  background:linear-gradient(90deg,#ff66cc,#b14dff,#00e0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:rgba(255,255,255,.45);font-size:13px;margin-bottom:22px;line-height:1.5}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{
  flex:1;padding:10px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);
}
.tab.active{background:linear-gradient(135deg,#b14dff,#ff2a6d);color:#fff}
label{display:block;font-size:11px;color:rgba(255,255,255,.45);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
input{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.35);color:#fff;font-size:14px;outline:none;margin-bottom:14px;
}
input:focus{border-color:#b14dff}
.btn{
  width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;
  cursor:pointer;color:#fff;background:linear-gradient(135deg,#b14dff,#ff2a6d);
  box-shadow:0 6px 20px rgba(180,50,255,.35);margin-top:4px;
}
.btn:active{transform:scale(.98)}
.msg{font-size:13px;text-align:center;margin-top:12px;min-height:18px}
.msg.err{color:#ff6b8a}.msg.ok{color:#00ffa8}
.link-row{text-align:center;margin-top:18px;font-size:13px;color:rgba(255,255,255,.4)}
.link-row a{color:#00e0ff;text-decoration:none}
.panel{display:none}.panel.active{display:block}
</style>
</head>
<body>
<div class="box">
  <h1>DJ Bar Live</h1>
  <p class="sub">Tạo tài khoản Admin để điều khiển sàn nhảy từ máy tính.<br>Người xem mở Sân khấu trên điện thoại bằng mã phòng.</p>

  <div class="tabs">
    <button class="tab active" data-tab="login">Đăng nhập</button>
    <button class="tab" data-tab="register">Đăng ký</button>
  </div>

  <div class="panel active" id="panel-login">
    <label>Tên đăng nhập</label>
    <input id="login-user" autocomplete="username" placeholder="Tên admin"/>
    <label>Mật khẩu</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="Mật khẩu"/>
    <button class="btn" id="btn-login">Đăng nhập</button>
  </div>

  <div class="panel" id="panel-register">
    <label>Tên đăng nhập</label>
    <input id="reg-user" autocomplete="username" placeholder="Tối thiểu 3 ký tự"/>
    <label>Mật khẩu</label>
    <input id="reg-pass" type="password" autocomplete="new-password" placeholder="Tối thiểu 4 ký tự"/>
    <label>Nhập lại mật khẩu</label>
    <input id="reg-pass2" type="password" autocomplete="new-password" placeholder="Nhập lại"/>
    <button class="btn" id="btn-register">Tạo tài khoản</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="link-row">
    Chỉ xem sân khấu? <a href="livebar.html">Vào bằng mã phòng →</a>
  </div>
</div>
<script>
const ACCOUNTS_KEY = 'djbar_accounts';

function getAccounts() {
  try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); } catch { return {}; }
}
function saveAccounts(a) {
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a));
}
function simpleHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
  return 'h' + Math.abs(h) + '_' + s.length;
}
function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    showMsg('', true);
  };
});

document.getElementById('btn-register').onclick = () => {
  const user = document.getElementById('reg-user').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  if (user.length < 3) return showMsg('Tên đăng nhập tối thiểu 3 ký tự');
  if (pass.length < 4) return showMsg('Mật khẩu tối thiểu 4 ký tự');
  if (pass !== pass2) return showMsg('Mật khẩu nhập lại không khớp');
  const accounts = getAccounts();
  if (accounts[user.toLowerCase()]) return showMsg('Tên này đã được dùng');
  accounts[user.toLowerCase()] = { user, hash: simpleHash(pass), created: Date.now() };
  saveAccounts(accounts);
  showMsg('Tạo tài khoản thành công! Hãy đăng nhập.', true);
  document.querySelector('[data-tab="login"]').click();
  document.getElementById('login-user').value = user;
};

document.getElementById('btn-login').onclick = () => {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const accounts = getAccounts();
  const acc = accounts[user.toLowerCase()];
  if (!acc || acc.hash !== simpleHash(pass)) return showMsg('Sai tên đăng nhập hoặc mật khẩu');
  sessionStorage.setItem('djbar_admin', JSON.stringify({ user: acc.user, at: Date.now() }));
  location.href = 'livebar.html';
};

// Enter key
['login-pass','reg-pass2'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (id.startsWith('login')) document.getElementById('btn-login').click();
      else document.getElementById('btn-register').click();
    }
  });
});

// Đã đăng nhập thì vào admin
try {
  const s = JSON.parse(sessionStorage.getItem('djbar_admin') || 'null');
  if (s && s.user && Date.now() - s.at < 86400000) location.href = 'livebar.html';
} catch {}
</script>
</body>
</html>
