<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="referrer" content="no-referrer"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#05030a"/>
<title>DJ Bar Live — Sân khấu</title>
<style>
html,body{
  width:100%;height:100%;margin:0;padding:0;overflow:hidden;
  background:#05030a;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;
  position:fixed;inset:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* ===== JOIN ===== */
#join-screen{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 0%,#24103a 0%,#0a0614 55%,#05030a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;
  padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
}
#join-screen.hidden{display:none}
#join-screen h1{
  font-size:clamp(26px,8vw,34px);margin:0 0 8px;text-align:center;font-weight:800;
  background:linear-gradient(90deg,#ff66cc,#b14dff,#00e0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
#join-screen .sub{
  color:rgba(255,255,255,.55);font-size:clamp(13px,3.5vw,15px);
  text-align:center;margin:0 0 28px;line-height:1.55;max-width:320px;
}
#join-screen .field{width:min(320px,100%);margin-bottom:12px}
#join-screen label{
  display:block;font-size:11px;color:rgba(255,255,255,.4);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;text-align:center;
}
#join-screen input{
  width:100%;padding:16px 12px;border-radius:14px;
  border:2px solid rgba(180,80,255,.45);
  background:rgba(0,0,0,.45);color:#fff;
  font-size:24px;font-weight:800;letter-spacing:8px;
  text-align:center;outline:none;text-transform:uppercase;
  font-family:ui-monospace,SFMono-Regular,monospace;
  -webkit-appearance:none;appearance:none;
}
#join-screen input:focus{border-color:#00e0ff;box-shadow:0 0 0 3px rgba(0,224,255,.15)}
#join-screen .btn{
  width:min(320px,100%);padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#b14dff,#ff2a6d);
  box-shadow:0 8px 24px rgba(180,50,255,.35);
  margin-top:4px;min-height:52px;
}
#join-screen .btn:disabled{opacity:.55}
#join-screen .msg{margin-top:14px;font-size:13px;color:#ff6b8a;min-height:20px;text-align:center;padding:0 12px}
#join-screen .hint{margin-top:22px;font-size:12px;color:rgba(255,255,255,.35);text-align:center;line-height:1.55}
#join-screen .hint a{color:#00e0ff;text-decoration:none}

/* ===== STAGE HUD ===== */
#stage-ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#stage-ui.show{display:block}

#led-wrap{
  position:absolute;left:50%;transform:translateX(-50%);
  top:max(8px,env(safe-area-inset-top));
  width:min(96vw,640px);max-width:calc(100% - 12px);
  background:rgba(8,4,18,.9);
  border:2px solid #ff66cc;
  box-shadow:0 0 18px rgba(255,100,200,.4);
  border-radius:10px;overflow:hidden;padding:7px 0;
}
#led-track{display:flex;white-space:nowrap;animation:marquee 14s linear infinite;will-change:transform}
#led-track span{
  font-size:clamp(12px,3.6vw,18px);font-weight:800;letter-spacing:2px;color:#ff66cc;
  text-shadow:0 0 8px #ff66cc,0 0 14px #ff2a6d;padding:0 28px;
  font-family:ui-monospace,monospace;
}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

#hud{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:max(10px,env(safe-area-inset-bottom));
  background:rgba(0,0,0,.6);padding:6px 14px;border-radius:16px;
  font-size:12px;color:rgba(255,255,255,.75);
  border:1px solid rgba(180,80,255,.35);white-space:nowrap;
  display:flex;align-items:center;gap:10px;pointer-events:auto;
}
#hud strong{color:#ff66cc}
#btn-sound{
  pointer-events:auto;border:none;border-radius:12px;padding:6px 10px;
  font-size:11px;font-weight:700;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#00e0ff,#0080ff);
}
#btn-music{pointer-events:auto;border:0;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:700;color:#fff;background:#8b42cc;cursor:pointer}
#btn-sound.on{background:linear-gradient(135deg,#00ffa8,#00aa66)}
#speech-status{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:max(48px,calc(env(safe-area-inset-bottom) + 40px));
  font-size:11px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.45);
  padding:4px 10px;border-radius:10px;max-width:90vw;text-align:center;
  pointer-events:none;display:none;
}
#speech-status.show{display:block}

#conn{
  position:absolute;
  top:max(52px,calc(env(safe-area-inset-top) + 44px));
  right:max(8px,env(safe-area-inset-right));
  font-size:11px;color:rgba(255,255,255,.4);
  background:rgba(0,0,0,.45);padding:4px 9px;border-radius:10px;
}
#conn.on{color:#00ffa8}

#join-toast{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(10,5,22,.95);border:2px solid #00e0ff;
  box-shadow:0 0 28px rgba(0,220,255,.4);
  padding:14px 20px;border-radius:14px;
  opacity:0;transition:opacity .28s,transform .28s;
  text-align:center;width:min(82vw,280px);
}
#join-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#join-toast .jt-label{font-size:10px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
#join-toast .jt-name{
  font-size:clamp(18px,5.5vw,26px);font-weight:800;
  background:linear-gradient(90deg,#ff66cc,#00e0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  word-break:break-word;
}
#join-toast .jt-sub{font-size:12px;color:#00ffa8;margin-top:5px}

/* Landscape tweaks */
@media (orientation:landscape) and (max-height:500px){
  #led-wrap{padding:4px 0;top:max(4px,env(safe-area-inset-top))}
  #led-track span{font-size:12px;padding:0 20px}
  #hud{bottom:max(6px,env(safe-area-inset-bottom));font-size:11px;padding:4px 10px}
  #conn{top:max(36px,calc(env(safe-area-inset-top) + 30px));font-size:10px}
  #join-toast{padding:10px 16px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="join-screen">
  <h1>DJ Bar Live</h1>
  <p class="sub">Nhập mã phòng từ máy Admin<br>để xem sân nhảy trên điện thoại</p>
  <div class="field">
    <label>Mã phòng</label>
    <input id="room-input" maxlength="6" placeholder="ABC123" autocomplete="off" enterkeyhint="go" inputmode="text" autocapitalize="characters"/>
  </div>
  <button class="btn" id="btn-join">Vào sân khấu</button>
  <div class="msg" id="join-msg"></div>
  <p class="hint">Mã phòng hiện trên trang Điều khiển (máy tính).<br>Admin: <a href="index.html">Đăng nhập</a></p>
</div>

<div id="stage-ui">
  <div id="led-wrap" style="display:none"><div id="led-track"><span id="led1">♪ FUNK PULSE  ·  </span><span id="led2">♪ FUNK PULSE  ·  </span></div></div>
  <div id="hud">Đang nhảy: <strong id="cnt">0</strong>
    <button type="button" id="btn-sound">Bật tiếng 🔊</button><button type="button" id="btn-music">Bật nhạc ▶</button>
  </div>
  <div id="speech-status"></div>
  <div id="stage-music" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:320px;height:150px;overflow:hidden;pointer-events:none;visibility:hidden">
    <div id="stage-music-label" style="color:#fff;font-size:12px;margin-bottom:5px">Nhạc sân khấu</div>
    <audio id="stage-audio" controls playsinline style="width:100%;display:none"></audio>
    <iframe id="stage-frame" title="Trình phát nhạc" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" style="width:100%;height:120px;border:0;display:none"></iframe>
  </div>
  <div id="conn">○ Chưa kết nối</div>
  <div id="join-toast">
    <div class="jt-label">Thông báo</div>
    <div class="jt-name" id="jt-name">—</div>
    <div class="jt-sub">đã vào sàn nhảy!</div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && innerWidth < 900);
const MAX_VISUAL = isMobile ? 36 : 60;
const MAX_TOTAL = 1000;
const DPR = Math.min(devicePixelRatio, isMobile ? 1.5 : 2);

const canvas = document.getElementById('c');
let renderer, scene, camera, clock;
let dancers = [];
let allNames = [];
let nameFrames = {};
let knownNames = new Set();
let discoBall, neonMeshes = [], spotLights = [], floorTiles = [], discoSpots = [];
let discoRays = [];
let dj = null, deckL, deckR, centerGlow;
let djLedRings = [], djLedDots = [], djConsoleLights = [];
let djOperator = null;
const djPlatformHeight = 1.65; // Dùng chung trong dựng sân khấu và vòng lặp hoạt ảnh
let djSign = null, djSignCanvas = null, djSignTexture = null, ceilingBeams = [], floorBeams = [];
let clubFloorTiles = [], wallBars = [];
let djPortalRings = [], djEqualizerBars = [];
let wallSongCanvas = null, wallSongTexture = null, wallSongTitle = "FUNK PULSE", lastWallSongFrame = -1;
let joinQueue = [], joinShowing = false;
let entranceQueue = [], activeEntrance = null;
let entryBurstTimer = null, entryBurstNames = [], entryBurstNoZoomUntil = 0;
let guestDjName = "", guestDjTravel = null;
let cameraHome = null;
const entranceCameraTarget = new THREE.Vector3(0,2,-2.5);
const entranceHomeTarget = new THREE.Vector3(0,2,-2.5);
let conn = null, peer = null, started = false;

const COLORS = ['#ff66aa','#66ccff','#ffcc44','#aaff66','#ff8866','#cc88ff','#66ffcc','#ff6688','#88aaff','#ffaa66','#66ffaa','#ff66cc','#ffffff','#00e0ff'];

function vw() { return window.visualViewport ? visualViewport.width : innerWidth; }
function vh() { return window.visualViewport ? visualViewport.height : innerHeight; }

function setConnUI(text, on) {
  const el = document.getElementById('conn');
  el.textContent = (on ? '● ' : '○ ') + text;
  el.className = on ? 'on' : '';
}

function showStageUI() {
  document.getElementById('join-screen').classList.add('hidden');
  document.getElementById('stage-ui').classList.add('show');
}

function fitCamera() {
  if (!camera) return;
  const w = vw(), h = vh();
  const aspect = w / h;
  camera.aspect = aspect;
  // Portrait: kéo camera ra xa + cao hơn để thấy cả sàn
  if (aspect < 0.85) {
    camera.fov = 60;
    camera.position.set(0, 5.7, 16.2);
  } else if (aspect < 1.2) {
    camera.fov = 55;
    camera.position.set(0, 5.6, 15.1);
  } else {
    // Landscape phone
    camera.fov = 50;
    camera.position.set(0, 5.3, 13.8);
  }
  camera.updateProjectionMatrix();
  camera.lookAt(0, 2.0, -2.5);
  cameraHome = camera.position.clone();
  entranceCameraTarget.copy(entranceHomeTarget);
}

function onResize() {
  if (!renderer || !camera) return;
  const w = vw(), h = vh();
  renderer.setSize(w, h, false);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  fitCamera();
}

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0618);
  scene.fog = new THREE.Fog(0x0a0618, isMobile ? 14 : 16, isMobile ? 32 : 36);

  camera = new THREE.PerspectiveCamera(52, vw() / vh(), 0.1, 50);

  renderer = new THREE.WebGLRenderer({
    canvas, antialias: !isMobile, powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setPixelRatio(DPR);
  renderer.setSize(vw(), vh(), false);

  clock = new THREE.Clock();

  scene.add(new THREE.AmbientLight(0x3a2860, 0.75));
  const f1 = new THREE.PointLight(0xff4a8a, 0.8, 20); f1.position.set(-4, 5, 3); scene.add(f1);
  const f2 = new THREE.PointLight(0x40e8ff, 0.65, 20); f2.position.set(4, 5, 3); scene.add(f2);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(7.0, isMobile ? 32 : 48),
    new THREE.MeshStandardMaterial({ color: 0x2a1a48, metalness: 0.5, roughness: 0.35 })
  );
  floor.rotation.x = -Math.PI / 2; scene.add(floor);

  centerGlow = null; // Không dùng vòng sáng giữa sàn.

  const tileColors = [0xd060ff, 0x3a7bff, 0xff77bb, 0x20ddff];
  const ringCount = isMobile ? 3 : 4;
  for (let r = 0; r < ringCount; r++) {
    const count = isMobile ? (6 + r * 4) : (8 + r * 5);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const rad = 1.15 + r * 1.35;
      const tile = new THREE.Mesh(
        new THREE.CircleGeometry(0.48, 6),
        new THREE.MeshBasicMaterial({ color: tileColors[(i + r) % 4], transparent: true, opacity: 0.85 })
      );
      tile.rotation.x = -Math.PI / 2;
      tile.position.set(Math.cos(a) * rad, 0.03, Math.sin(a) * rad);
      scene.add(tile);
      floorTiles.push({ mesh: tile, phase: i + r * 3 });
    }
  }

  const ring = new THREE.Mesh(new THREE.TorusGeometry(6.8, 0.09, 6, 40), new THREE.MeshBasicMaterial({ color: 0xff66cc }));
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.05; scene.add(ring);
  neonMeshes.push({ mesh: ring, color: new THREE.Color(0xff66cc) });

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x16102a });
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(18, 7.5), wallMat);
  backWall.position.set(0, 3.7, -7.2); scene.add(backWall);
  // Màn LED tên bài hát đặt cao trên đỉnh cổng LED, không che DJ.
  wallSongCanvas = document.createElement('canvas');
  wallSongCanvas.width = 1024; wallSongCanvas.height = 160;
  wallSongTexture = new THREE.CanvasTexture(wallSongCanvas);
  wallSongTexture.colorSpace = THREE.SRGBColorSpace;
  const wallSongMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(9.8, 0.92),
    new THREE.MeshBasicMaterial({map:wallSongTexture,transparent:false,side:THREE.DoubleSide})
  );
  wallSongMesh.position.set(0, 5.42, -6.91);
  scene.add(wallSongMesh);
  // Cổng LED 3D phía sau DJ: các vòng đa giác lùi sâu về phía tường.
  // Giữ phần chữ tên bài hát ở phía trước, không bị LED che.
  const portalColors = [0xff39b8, 0x00eaff, 0xa96aff, 0xffd65c];
  const portalLayers = isMobile ? 5 : 7;
  for (let i = 0; i < portalLayers; i++) {
    const w = 4.95 - i * 0.43;
    const h = 4.25 - i * 0.34;
    const depth = -6.98 - i * 0.025;
    const points = [
      new THREE.Vector3(-w/2, 2.65-h/2, depth),
      new THREE.Vector3(-w/2, 2.65+h/2-0.50, depth),
      new THREE.Vector3(-w/2+0.55, 2.65+h/2, depth),
      new THREE.Vector3(w/2-0.55, 2.65+h/2, depth),
      new THREE.Vector3(w/2, 2.65+h/2-0.50, depth),
      new THREE.Vector3(w/2, 2.65-h/2, depth)
    ];
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
      color: portalColors[i%portalColors.length], transparent:true, opacity:0.65
    });
    const line = new THREE.Line(geom,material);
    scene.add(line);
    djPortalRings.push({mesh:line, phase:i*0.65});
  }
  // Hai cụm Equalizer LED ở hai bên cổng, thay đổi độ cao theo nhịp.
  const eqCount = isMobile ? 8 : 12;
  for (const side of [-1,1]) {
    for (let i=0;i<eqCount;i++) {
      const x = side * (3.12 + i*0.25);
      const height=0.48;
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(0.145,height,0.07),
        new THREE.MeshBasicMaterial({color:portalColors[(i+(side===1?1:0))%4]})
      );
      bar.position.set(x,1.98,-7.015);
      scene.add(bar);
      djEqualizerBars.push({mesh:bar,phase:i*0.72+(side===1?2.4:0),base:1.70});
    }
  }
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 7.5), wallMat);
  leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-9, 3.7, 0); scene.add(leftWall);
  const rightWall = leftWall.clone(); rightWall.position.x = 9; rightWall.rotation.y = -Math.PI / 2; scene.add(rightWall);

  function panel(x, y, z, w, h, color) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 }));
    p.position.set(x, y, z); scene.add(p);
    neonMeshes.push({ mesh: p, color: new THREE.Color(color) });
  }
  panel(-4, 3.5, -7.1, 3, 0.85, 0xff2a6d);
  panel(4, 3.5, -7.1, 3, 0.85, 0x00e0ff);
  panel(0, 2.7, -7.1, 5, 0.55, 0xb14dff);

  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(18, 14), new THREE.MeshStandardMaterial({ color: 0x0e0a18 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.y = 7.6; scene.add(ceil);

  const spotN = isMobile ? 8 : 12;
  for (let i = 0; i < spotN; i++) {
    const x = -5.8 + i * (11.6 / (spotN - 1));
    const lens = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffcc44 }));
    lens.position.set(x, 7.2, -1.2); scene.add(lens);
    const spot = new THREE.PointLight(0xffcc66, isMobile ? 0.28 : 0.52, 11);
    spot.position.set(x, 6.8, -0.3); scene.add(spot);
    spotLights.push({ light: spot, lens, phase: i * 0.4 });
  }

  // Đèn laser sợi mảnh bố trí đều dọc hai mép tường, chiếu xiên vào tâm sàn.
  // Dùng mesh giả ánh sáng để không gây tải nặng trên điện thoại.
  const beamColors = [0x00eaff, 0xff38aa, 0x9b68ff, 0xffce55, 0x34ffbc, 0xff6a92];
  const beamCount = isMobile ? 8 : 12; // 6 tia mỗi bên trên máy tính, 4 tia mỗi bên trên điện thoại
  for (let i = 0; i < beamCount; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const perWall = beamCount / 2;
    const wallIndex = Math.floor(i / 2);
    const x = side * 7.45;
    const z = -5.7 + wallIndex * (10.5 / Math.max(1, perWall-1));
    const y = 7.12; // gắn sát mép trên của hai tường
    const targetX = side * (0.25 + (wallIndex % 3) * 0.40);
    const targetZ = Math.max(-4.0, Math.min(4.8, z * 0.48 + ((wallIndex % 3)-1)*0.75));
    const color = beamColors[i % beamColors.length];
    const startPoint = new THREE.Vector3(x, y, z);
    const endPoint = new THREE.Vector3(targetX, 0.10, targetZ);
    const vector = new THREE.Vector3().subVectors(endPoint, startPoint);
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.045, vector.length(), 6, 1, true),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.28,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending})
    );
    beam.position.copy(startPoint).add(endPoint).multiplyScalar(0.5);
    beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vector.clone().normalize());
    scene.add(beam);
    const glow = new THREE.Mesh(new THREE.CircleGeometry(0.17, 12),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.23,depthWrite:false,blending:THREE.AdditiveBlending}));
    glow.rotation.x=-Math.PI/2;glow.position.copy(endPoint);glow.position.y=0.065;scene.add(glow);
    const fixture = new THREE.Mesh(new THREE.BoxGeometry(0.24,0.22,0.30),new THREE.MeshStandardMaterial({color:0x151521,metalness:0.6,roughness:0.3}));
    fixture.position.copy(startPoint);scene.add(fixture);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.085,10),new THREE.MeshBasicMaterial({color}));
    lens.position.set(x-side*0.15,y,z+0.08);lens.rotation.y=side*Math.PI/2;scene.add(lens);
    ceilingBeams.push({beam,glow,fixture,lens,phase:i*0.8,angle:i*1.1,x,y,z,targetX,targetZ,side});
  }
  // Chỉ giữ các ô LED lục giác trên mặt sàn; bỏ toàn bộ ô kim cương.
  // Viền sàn 3 lớp, phân tách rõ sân khấu với khu vực xung quanh.
  [5.95,6.36,6.72].forEach((r,i)=>{

  legR.position.set(0.1, 0.26, 0); g.add(legR);
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(isDJ ? 0.25 : 0.22, 0.4, 3, segs),

function makeLabel(text, frame='none') {
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;
  const ctx=cv.getContext('2d');
  const themes={
    gold:['#ffcf54','#fff0a0','#8d5200','♛'],
    neon:['#ff4dbd','#ffc2ed','#710b69','★'],
    ice:['#55eaff','#d7ffff','#0c5980','◆'],
    fire:['#ff713b','#ffe08c','#98221a','✦'],
    galaxy:['#a56cff','#f1b9ff','#4e2299','✧']
  };
  const theme=themes[frame],display=String(text).slice(0,22);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(theme){
    const grad=ctx.createLinearGradient(0,0,512,128);
    grad.addColorStop(0,theme[0]);grad.addColorStop(0.5,theme[1]);grad.addColorStop(1,theme[2]);
    ctx.shadowColor=theme[0];ctx.shadowBlur=19;
    ctx.fillStyle='rgba(7,9,26,0.93)';
    ctx.beginPath();ctx.roundRect(14,14,484,100,25);ctx.fill();
    ctx.strokeStyle=grad;ctx.lineWidth=7;ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=theme[1];ctx.font='bold 34px system-ui,sans-serif';
    ctx.fillText(theme[3]+' '+display+' '+theme[3],256,65,450);
  }else{
    ctx.font='bold 39px system-ui,sans-serif';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,0.75)';
    ctx.strokeText(display,256,65,475);
    ctx.fillStyle='#ffffff';ctx.fillText(display,256,65,475);
  }
  const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  spr.scale.set(theme?2.05:1.65,theme?0.51:0.41,1);spr.position.y=1.85;
  spr.userData.labelTexture=tex;return spr;
}
function updateNameplates(){
  dancers.forEach(d=>{
    const frame=nameFrames[d.name.toLowerCase()]||'none';
    if(d.frame===frame)return;
    const old=d.label;if(old){d.avatar.remove(old);old.material.map.dispose();old.material.dispose();}
    d.label=makeLabel(d.name,frame);d.avatar.add(d.label);d.frame=frame;
  });
}

function layoutVisual() {
  const n = dancers.length;
  if (!n) return;
  const rings = n <= 12 ? 1 : n <= 28 ? 2 : 3;
  let idx = 0;
  for (let r = 0; r < rings && idx < n; r++) {
    const inRing = Math.ceil((n - idx) / (rings - r));
    const radius = 1.9 + r * 1.55;
    for (let i = 0; i < inRing && idx < n; i++, idx++) {
      const a = (i / inRing) * Math.PI * 2 - Math.PI / 2;
      const d = dancers[idx];
      d.mesh.position.x = Math.cos(a) * radius;
      d.mesh.position.z = Math.sin(a) * radius;
      d.mesh.rotation.y = a + Math.PI;
      d.targetX = d.mesh.position.x;
      d.targetZ = d.mesh.position.z;
      if (d.entering && Number.isFinite(d.startX)) d.mesh.position.set(d.startX,0,d.startZ);
      if (d.pendingEntrance) d.mesh.visible=false;
      if (d.name.toLowerCase()===guestDjName.toLowerCase() && !guestDjTravel) d.mesh.position.set(2.0,djPlatformHeight,-6.85);
    }
  }
}

// Stable, per-user outfit color. Does not depend on dancer ordering or batch size.
function outfitColorForName(name) {
  const key = String(name || '').normalize('NFC').toLowerCase();
  let hash = 2166136261;
  for (const char of key) {
    hash ^= char.codePointAt(0);
    hash = Math.imul(hash, 16777619);
  }
  const hue = ((hash >>> 0) * 0.618033988749895) % 1;
  return new THREE.Color().setHSL(hue, 0.78, 0.60);
}

function rebuildVisual() {
  const previous = new Map(dancers.map(d => [d.name.toLowerCase(),d]));
  const next = [];
  allNames.slice(-MAX_VISUAL).forEach((name, i) => {
    let d = previous.get(name.toLowerCase());
    if (!d) {
      const mesh = new THREE.Group();
      const avatar = createChar(outfitColorForName(name));
      const label=makeLabel(name,nameFrames[name.toLowerCase()]||'none');
      avatar.add(label);
      mesh.add(avatar);
      scene.add(mesh);
      d = { mesh, avatar, name, label, frame:nameFrames[name.toLowerCase()]||'none', pendingEntrance:true };
      mesh.visible=false; // New arrivals must never render on the dance floor before entrance scheduling.
    }
    next.push(d);
    previous.delete(name.toLowerCase());
  });
  previous.forEach(d => { scene.remove(d.mesh); entranceQueue=entranceQueue.filter(x=>x!==d); if(activeEntrance?.d===d)activeEntrance=null; });
  dancers = next;
  updateNameplates();
  layoutVisual();
  if(guestDjName && !dancers.some(d=>d.name.toLowerCase()===guestDjName.toLowerCase())) setGuestDj('');
  document.getElementById('cnt').textContent = allNames.length;
}

function refreshVoices() {
  try {
    cachedVoices = window.speechSynthesis ? (window.speechSynthesis.getVoices() || []) : [];
  } catch (e) { cachedVoices = []; }
  return cachedVoices;
}

function pickVietnameseVoice() {
  const voices = refreshVoices();
  if (!voices.length) return null;
  const score = (v) => {
    const lang = (v.lang || '').toLowerCase();
    const name = (v.name || '').toLowerCase();
    let s = 0;
    if (lang === 'vi-vn') s += 200;
    if (lang.startsWith('vi')) s += 150;
    if (/vietnamese|vietnam|tiếng việt|tieng viet/.test(name)) s += 120;
    if (/google/.test(name) && lang.startsWith('vi')) s += 90;
    return s;
  };
  const ranked = voices.map(v => ({ v, s: score(v) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  return ranked.length ? ranked[0].v : null;
}

// ---------- Chuẩn hoá chữ trước khi đọc ----------
function cleanForSpeech(str) {
  let t = String(str || '').normalize('NFC');           // gộp dấu: "e" + "̂" → "ê" (bàn phím iPhone hay tách dấu)
  t = t.replace(/[_]+/g, ' ')
       .replace(/[^\p{L}\p{M}\p{N}\s.,'’-]/gu, ' ')     // bỏ emoji / ký tự lạ làm TTS đọc sai
       .replace(/\s+/g, ' ').trim();
  return t;
}
function speakableName(name) {
  let t = cleanForSpeech(name);
  // Tên VIẾT HOA toàn bộ dễ bị đọc từng chữ cái → đổi sang chữ thường
  if (t.length > 3 && t === t.toLocaleUpperCase('vi')) t = t.toLocaleLowerCase('vi');
  return t;
}

function playChime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!window.__djAudioCtx) window.__djAudioCtx = new AC();
    const ctx = window.__djAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime;
    [660, 880, 1100].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.32);
    });
  } catch (e) {}
}

// Google Translate không cho phép fetch từ localhost (CORS).
// Không fetch/cố giải mã URL bên thứ ba; dùng SpeechSynthesis nội bộ trước.
// Chỉ khuếch đại âm thanh TTS tải được qua CORS; không tác động nhạc nền.
// SpeechSynthesis của trình duyệt không cho Web Audio tăng quá volume=1.
async function playAmplifiedTts(url) {
  let ctx, source;
  try {
    const response = await fetch(url, {mode:'cors'});
    if (!response.ok) return false;
    const bytes = await response.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = window.__djAudioCtx || (window.__djAudioCtx = new AC());
    if (ctx.state === 'suspended') await ctx.resume();
    const buffer = await ctx.decodeAudioData(bytes);
    source = ctx.createBufferSource(); source.buffer = buffer;
    const gain = ctx.createGain(); gain.gain.value = 2.5;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -12; limiter.knee.value = 0;
    limiter.ratio.value = 18; limiter.attack.value = 0.003;
    limiter.release.value = 0.16;
    source.connect(gain); gain.connect(limiter); limiter.connect(ctx.destination);
    return await new Promise(resolve => {
      let ended = false;
      source.onended = () => { if (!ended) { ended=true; resolve(true); } };
      try { source.start(); } catch(e) { ended=true; resolve(false); }
    });
  } catch(e) { return false; }
}
// ---------- 1) Giọng Google tiếng Việt (có dấu) ----------
function playGoogleUrl(url) {
  return new Promise((resolve) => {
    try {
      if (!ttsAudio) ttsAudio = new Audio();
      ttsAudio.playsInline = true;
      try { ttsAudio.pause(); } catch (e) {}
      let finished = false, started = false, t1, t2;
      const done = (ok) => {
        if (finished) return;
        finished = true; clearTimeout(t1); clearTimeout(t2);
        resolve(ok);
      };
      ttsAudio.onplaying = () => { started = true; };
      ttsAudio.onended = () => done(true);
      ttsAudio.onerror = () => done(false);
      ttsAudio.src = url;
      ttsAudio.volume = 1;
      const p = ttsAudio.play();
      if (p && p.catch) p.catch((err) => { console.warn('google tts', err); done(false); });
      t1 = setTimeout(() => { if (!started) done(false); }, 4500);   // không phát được → thử cách khác
      t2 = setTimeout(() => done(started), 15000);
    } catch (e) { resolve(false); }
  });
}
async function speakWithGoogle(text) {
  const q = encodeURIComponent(text.normalize('NFC').slice(0, 180));
  const urls = [
    'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q=' + q,
    'https://translate.google.com.vn/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q=' + q,
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=vi&q=' + q
  ];
  for (const u of urls) { if (await playGoogleUrl(u)) return true; }
  return false;
}

// ---------- VoiceRSS (có khóa miễn phí, rất ổn định, có tiếng Việt) ----------
let ttsKey = '';
try { ttsKey = localStorage.getItem('djbar_tts_key') || ''; } catch (e) {}
function setTtsKey(k) {
  k = String(k || '').trim();
  if (k === ttsKey) return;
  ttsKey = k;
  try { localStorage.setItem('djbar_tts_key', k); } catch (e) {}
}
async function speakWithVoiceRss(text) {
  if (!ttsKey) return false;
  const url = 'https://api.voicerss.org/?key=' + encodeURIComponent(ttsKey) +
    '&hl=vi-vn&c=MP3&f=24khz_16bit_mono&src=' + encodeURIComponent(text.normalize('NFC').slice(0, 300));
  if (await playAmplifiedTts(url)) return true;
  return playGoogleUrl(url);
}

// ---------- 2) Giọng của máy — CHỈ khi máy có giọng tiếng Việt thật ----------
// (giọng tiếng Anh đọc "đã vào sàn nhảy" sẽ sai dấu/sai âm nên không dùng)
const keepUtts = [];
function speakWithSynth(text) {
  return new Promise((resolve) => {
    const synth = window.speechSynthesis;
    const voices = refreshVoices();
    const voice = pickVietnameseVoice();
    // Có danh sách giọng mà không có giọng Việt → bỏ (giọng Anh đọc sai).
    // Danh sách rỗng (Android/iOS hay vậy) → vẫn thử với lang vi-VN.
    if (!synth || (!voice && voices.length)) { resolve(false); return; }
    let started = false, finished = false, t1, t2;
    const done = (ok) => {
      if (finished) return;
      finished = true; clearTimeout(t1); clearTimeout(t2);
      resolve(ok);
    };
    const go = () => {
      try {
        if (synth.paused) synth.resume();
        const u = new SpeechSynthesisUtterance(text);
        if (voice) u.voice = voice;
        u.lang = (voice && voice.lang) || 'vi-VN';
        u.rate = 0.86; u.pitch = 1; u.volume = 1;
        keepUtts.push(u); if (keepUtts.length > 20) keepUtts.shift();
        u.onstart = () => { started = true; };
        u.onend = () => done(true);
        u.onerror = (ev) => { console.warn('synth', ev && ev.error); done(false); };
        synth.speak(u);
        t1 = setTimeout(() => { if (!started) { try { synth.cancel(); } catch (e) {} done(false); } }, 3000);
        t2 = setTimeout(() => done(started), 12000);
      } catch (e) { done(false); }
    };
    if (synth.speaking || synth.pending) { try { synth.cancel(); } catch (e) {} setTimeout(go, 120); }
    else go();
  });
}

// ---------- Hàng đợi đọc: lần lượt từng câu, không đọc đè ----------
let vnChain = Promise.resolve();
function speakVietnamese(text) {
  const say = String(text || '').normalize('NFC').trim();
  if (!say) return Promise.resolve(false);
  const p = vnChain.then(async () => {
    setSpeechStatus('Đang đọc: ' + say);
    let ok = false;
    if (ttsKey) ok = await speakWithVoiceRss(say);
    if (!ok) ok = await speakWithSynth(say);
    if (!ok) ok = await speakWithGoogle(say);
    if (!ok) {
      playChime();
      setSpeechStatus(ttsKey ? 'Không đọc được: kiểm tra khóa VoiceRSS / mạng' : 'Không đọc được tiếng Việt — nhờ Admin nhập khóa VoiceRSS (miễn phí) hoặc cài giọng Việt cho máy');
      await new Promise(r => setTimeout(r, 2500));
    }
    setTimeout(() => setSpeechStatus(''), 600);
    await new Promise(r => setTimeout(r, 200));
    return ok;
  }).catch((e) => { console.warn(e); return false; });
  vnChain = p.then(() => {});
  return p;
}

function speakJoin(name) {
  const n = speakableName(name);
  if (!n) return;
  speakVietnamese(n + ' đã vào sàn nhảy');
}

function showJoinToast(name) {
  const n = String(name || '').trim();
  if (!n) return;
  // Queue the visual entrance first; announce only when the avatar is revealed.
  scheduleEntrance(n);
}

// Gom khách vào gần nhau thành một lượt: 1 người thì đón bằng camera,
// từ 2 người trở lên thì vào ngay toàn sàn, không zoom và không xếp hàng.
function finishEntrance(d) {
  if (!d) return;
  d.pendingEntrance=false;
  d.entering=false;
  d.mesh.visible=true;
  d.mesh.position.set(d.targetX,0,d.targetZ);
}
function cancelAllEntrances() {
  if(entryBurstTimer)clearTimeout(entryBurstTimer);
  entryBurstTimer=null;
  const burstNames=entryBurstNames.slice();
  entryBurstNames=[];
  if(activeEntrance)finishEntrance(activeEntrance.d);
  activeEntrance=null;
  entranceQueue.forEach(finishEntrance);
  entranceQueue=[];
  dancers.forEach(d=>{if(d.pendingEntrance)finishEntrance(d);});
  // A burst skips individual camera entrances, so announce the group now.
  burstNames.forEach(enqueueJoinAnnouncement);
}
function enqueueJoinAnnouncement(name) {
  if (!name) return;
  joinQueue.push(name);
  processJoinQueue();
}
function scheduleEntrance(name) {
  const now=performance.now();
  const d=dancers.find(d=>d.name.toLowerCase()===name.toLowerCase());
  if (!d) { enqueueJoinAnnouncement(name); return; }
  if (d.entering || entranceQueue.includes(d) || activeEntrance?.d===d || entryBurstNames.some(n=>n.toLowerCase()===name.toLowerCase())) return;
  if(now < entryBurstNoZoomUntil){finishEntrance(d);enqueueJoinAnnouncement(name);return;}
  // Không render avatar tại vị trí sân khấu trong thời gian gom lượt.
  d.pendingEntrance=true;
  d.mesh.visible=false;
  entryBurstNames.push(name);
  if(entryBurstTimer)clearTimeout(entryBurstTimer);
  if(entryBurstNames.length>=2){
    entryBurstNoZoomUntil=now+2200;
    cancelAllEntrances();
    return;
  }
  entryBurstTimer=setTimeout(()=>{
    entryBurstTimer=null;
    const arrivals=entryBurstNames.splice(0);
    if(arrivals.length===1)queueEntrance(arrivals[0]);
  },1100);
}
function queueEntrance(name) {
  const d=dancers.find(d=>d.name.toLowerCase()===name.toLowerCase());
  if(!d)return;
  if(entranceQueue.includes(d)||activeEntrance?.d===d)return;
  d.pendingEntrance=true;
  d.entering=true;
  d.startX=Math.max(-2.1,Math.min(2.1,d.targetX));
  d.startZ=10.6;
  d.mesh.position.set(d.startX,0,d.startZ);
  d.mesh.visible=false;
  entranceQueue.push(d);
}
function setGuestDj(name){
  const next=String(name||'').trim();
  if(next && !dancers.some(d=>d.name.toLowerCase()===next.toLowerCase()))return;
  if(guestDjName.toLowerCase()===next.toLowerCase())return;
  const old=dancers.find(d=>d.name.toLowerCase()===guestDjName.toLowerCase());
  if(old){guestDjTravel={d:old,elapsed:0,returning:true,start:old.mesh.position.clone()};}
  guestDjName=next;
  if(next){
    const d=dancers.find(d=>d.name.toLowerCase()===next.toLowerCase());
    if(d){finishEntrance(d);entranceQueue=entranceQueue.filter(x=>x!==d);if(activeEntrance?.d===d)activeEntrance=null;
      guestDjTravel={d,elapsed:0,returning:false,start:d.mesh.position.clone()};}
  }
}
function updateGuestDj(dt){
  if(!guestDjTravel)return;
  const g=guestDjTravel,d=g.d;
  if(!dancers.includes(d)){guestDjTravel=null;return;}
  g.elapsed+=dt;
  // Đi vòng qua cạnh phải bục DJ, bước lên sân khấu rồi đứng nhảy cạnh DJ.
  const points=g.returning?
    [g.start,new THREE.Vector3(3.3,djPlatformHeight,-5.0),new THREE.Vector3(3.3,0,-4.1),new THREE.Vector3(d.targetX,0,d.targetZ)]:
    [g.start,new THREE.Vector3(3.3,0,-4.1),new THREE.Vector3(3.3,djPlatformHeight,-5.0),new THREE.Vector3(2.0,djPlatformHeight,-6.85)];
  const progress=Math.min(1,g.elapsed/4.5)*3;
  const i=Math.min(2,Math.floor(progress)),alpha=progress-i;
  d.mesh.position.copy(points[i]).lerp(points[i+1],alpha);
  d.mesh.rotation.y=Math.PI;
  if(progress>=3){guestDjTravel=null;if(g.returning)d.mesh.position.set(d.targetX,0,d.targetZ);}
}
function updateEntrance(dt,t) {
  if(!activeEntrance && entranceQueue.length && performance.now()>=entryBurstNoZoomUntil){
    const d=entranceQueue.shift();
    if(dancers.includes(d)){
      activeEntrance={d,elapsed:0};
      // Đặt camera ở góc đón TRƯỚC khi nhân vật được render.
      const follow=new THREE.Vector3(d.startX*0.70,3.5,Math.min(15.5,d.startZ+5.5));
      camera.position.copy(follow); // Cut to entrance before revealing avatar; never show the stage first.
      entranceCameraTarget.set(d.startX,1.15,d.startZ);
      camera.lookAt(entranceCameraTarget);
      d.mesh.position.set(d.startX,0,d.startZ);
      d.pendingEntrance=false;
      d.mesh.visible=true;
      // Announcement and reveal happen in the same animation frame.
      enqueueJoinAnnouncement(d.name);
    }
  }
  const a=activeEntrance;
  if(!a)return;
  if(!dancers.includes(a.d)){activeEntrance=null;return;}
  a.elapsed+=dt;
  const walk=Math.min(1,a.elapsed/3.4);
  const smooth=walk*walk*(3-2*walk);
  const d=a.d;
  d.mesh.position.x=d.startX+(d.targetX-d.startX)*smooth;
  d.mesh.position.z=d.startZ+(d.targetZ-d.startZ)*smooth;
  d.mesh.rotation.y=Math.PI;
  if(a.elapsed>=5.5){finishEntrance(d);activeEntrance=null;}
}
function updateEntranceCamera(dt,t) {
  if(!camera||!cameraHome)return;
  const a=performance.now()<entryBurstNoZoomUntil?null:activeEntrance;
  const home=cameraHome;
  let wanted=home;
  const look=new THREE.Vector3(0,2,-2.5);
  if(a){
    const d=a.d,elapsed=a.elapsed;
    // Camera đã đứng ở lối vào, chỉ giảm dần mức theo dõi lúc kết thúc.
    const out=Math.min(1,Math.max(0,(5.5-elapsed)/1.5));
    const weight=out*out*(3-2*out);
    const follow=new THREE.Vector3(d.mesh.position.x*0.70,3.5,Math.min(15.5,d.mesh.position.z+5.5));
    wanted=home.clone().lerp(follow,weight*0.90);
    look.lerp(new THREE.Vector3(d.mesh.position.x,1.15,d.mesh.position.z),weight);
  }
  const alpha=1-Math.exp(-dt*5);
  camera.position.lerp(wanted,alpha);
  entranceCameraTarget.lerp(look,alpha);
  camera.lookAt(entranceCameraTarget);
}

function processJoinQueue() {
  if (joinShowing || !joinQueue.length) return;
  joinShowing = true;
  const name = joinQueue.shift();
  const nameEl = document.getElementById('jt-name');
  if (nameEl) nameEl.textContent = name;
  const el = document.getElementById('join-toast');
  if (el) el.classList.add('show');
  speakJoin(name);
  setTimeout(() => {
    if (el) el.classList.remove('show');
    setTimeout(() => { joinShowing = false; processJoinQueue(); }, 300);
  }, 3500);
}

// Nhạc nhận từ Admin. Mỗi trình duyệt tự phát âm thanh trên thiết bị của mình.
let currentMusicUrl = '';
let currentMusicRevision = -1;
let soundcloudWidget = null;
let soundcloudReady = false;
let soundcloudPendingPlay = false;
let soundcloudScriptPromise = null;
function loadSoundCloudApi() {
  if (window.SC && window.SC.Widget) return Promise.resolve(true);
  if (soundcloudScriptPromise) return soundcloudScriptPromise;
  soundcloudScriptPromise = new Promise(resolve => {
    const script=document.createElement('script');
    script.src='https://w.soundcloud.com/player/api.js';
    script.onload=()=>resolve(!!(window.SC && window.SC.Widget));
    script.onerror=()=>resolve(false);
    document.head.appendChild(script);
  });
  return soundcloudScriptPromise;
}
async function initSoundCloudWidget(frame) {
  soundcloudWidget=null; soundcloudReady=false;
  if (!await loadSoundCloudApi() || !frame.isConnected || frame.style.display==='none') {
    document.getElementById('stage-music-label').textContent='Không tải được SoundCloud API. Hãy bấm ▶ trong trình phát.';
    return;
  }
  const widget=window.SC.Widget(frame);
  soundcloudWidget=widget;
  widget.bind(window.SC.Widget.Events.READY,()=>{
    if (soundcloudWidget!==widget)return;
    soundcloudReady=true;
    if(soundcloudPendingPlay) { try { widget.play(); } catch(e) {} }
  });
  widget.bind(window.SC.Widget.Events.PLAY,()=>{
    if(soundcloudWidget!==widget)return;

}

function duckStageMusic(duck) {
  // Tạm ngắt nhạc trong lúc đọc để tránh lấn giọng, sau đó khôi phục.
  const audio = document.getElementById('stage-audio');
  if (audio) audio.volume = duck ? 0.08 : 0.65;

  if (frame && frame.src.includes('youtube.com/embed/')) {
    try { frame.contentWindow.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[duck ? 8 : 65]}), '*'); } catch(e) {}
  }
}

function parseStageMusic(url) {
  try {
    const u = new URL(url);
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
    const host = u.hostname.toLowerCase();
    let id = '';
    if (host === 'youtu.be' || host === 'www.youtu.be') id = u.pathname.split('/')[1] || '';
    else if (['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)) {
      if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else if (/^\/(embed|live|shorts)\//.test(u.pathname)) id = u.pathname.split('/')[2] || '';
    }
    if (/^[\w-]{11}$/.test(id)) return {type:'iframe',src:'https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&enablejsapi=1&loop=1&playlist='+id};
    if (host === 'soundcloud.com' || host.endsWith('.soundcloud.com')) return {type:'soundcloud',src:'https://w.soundcloud.com/player/?url='+encodeURIComponent(u.href)+'&auto_play=false&show_artwork=false&visual=false'};
    if (/\.(mp3|ogg|wav|m4a)(?:$|\?)/i.test(u.pathname+u.search)) return {type:'audio',src:u.href};
  } catch(e) {}
  return null;
}
function stopStageMusic() {
  const audio = document.getElementById('stage-audio');
  const frame = document.getElementById('stage-frame');
  audio.pause(); audio.removeAttribute('src'); audio.load();
  soundcloudWidget=null; soundcloudReady=false; soundcloudPendingPlay=false;
  frame.src='about:blank';
  audio.style.display='none'; frame.style.display='none';
  document.getElementById('stage-music').style.display='none';
  document.getElementById('btn-music').textContent='Bật nhạc ▶';
}
function setStageMusic(url, revision) {
  if (revision !== undefined && revision < currentMusicRevision) return;
  if (revision !== undefined) currentMusicRevision = revision;
  if (url === currentMusicUrl) return;
  currentMusicUrl = url || '';
  stopStageMusic();
  if (!currentMusicUrl) return;
  const p = parseStageMusic(currentMusicUrl);
  const box = document.getElementById('stage-music');
  const label = document.getElementById('stage-music-label');
  box.style.display='block';
  if (!p) {
    label.textContent='Link chưa hỗ trợ. Dùng YouTube, SoundCloud hoặc URL MP3 trực tiếp.';
    return;
  }
  label.textContent='Nhạc sân khấu — nếu chưa nghe thấy, bấm ▶ bên dưới';
  if (p.type === 'audio') {
    const audio = document.getElementById('stage-audio');
    audio.style.display='block'; audio.src=p.src; audio.loop=true; audio.volume=0.65;
    audio.play().then(()=>{document.getElementById('btn-music').textContent='Nhạc đang phát ♪';})
      .catch(()=>{label.textContent='Trình duyệt chặn tự phát — bấm Bật nhạc hoặc ▶';});
  } else {
    const frame=document.getElementById('stage-frame');
    frame.style.display='block'; frame.src=p.src;
    if(p.type==='soundcloud'){
      label.textContent='SoundCloud: bấm Bật nhạc ▶ hoặc ▶ trong khung nếu trình duyệt chặn autoplay';
      soundcloudPendingPlay=false;
      initSoundCloudWidget(frame);
    } else {
      label.textContent='YouTube: nếu bị chặn tự phát, bấm ▶ trong khung bên dưới';
    }
  }
}
document.getElementById('btn-music').addEventListener('click', () => {
  const audio=document.getElementById('stage-audio');
  if (audio.src && audio.style.display !== 'none') {
    audio.play().then(()=>{document.getElementById('btn-music').textContent='Nhạc đang phát ♪';})
      .catch(()=>{document.getElementById('stage-music-label').textContent='Không phát được file. Kiểm tra link MP3/CORS.';});
  } else if (currentMusicUrl) {
    const p=parseStageMusic(currentMusicUrl);
    if(p && p.type==='soundcloud') {
      playSoundCloud();
    } else if(p && p.type==='iframe') {
      document.getElementById('stage-frame').src=p.src;
      document.getElementById('stage-music').style.display='block';
    }
  }
});

function applyState(st) {
  if(st.nameFrames && typeof st.nameFrames==='object'){nameFrames=st.nameFrames;updateNameplates();}
  if (typeof st.ttsKey === 'string') setTtsKey(st.ttsKey);
  if (st.song) setSong(st.song);
  if (typeof st.djLabel === 'string') setDjLabel(st.djLabel);
  if (typeof st.musicUrl === 'string') setStageMusic(st.musicUrl, st.musicRevision);
  if (Array.isArray(st.names)) {
    const incoming = st.names.map(n => String(n).trim()).filter(Boolean);
    const newOnes = incoming.filter(n => !knownNames.has(n.toLowerCase()));
    allNames = incoming.slice(0, MAX_TOTAL);
    knownNames = new Set(allNames.map(n => n.toLowerCase()));
    rebuildVisual();
    newOnes.forEach(n => showJoinToast(n));
    if(typeof st.guestDjName==='string')setGuestDj(st.guestDjName);
  }
}

function setDjLabel(value) {
  if (!djSignCanvas || !djSignTexture) return;
  const ctx = djSignCanvas.getContext('2d');
  const text = String(value || 'DJ BAR LIVE').trim().slice(0, 38);
  ctx.clearRect(0,0,1024,256);
  ctx.fillStyle = '#100b25'; ctx.fillRect(0,0,1024,256);
  ctx.strokeStyle = '#00eaff'; ctx.lineWidth = 11; ctx.strokeRect(8,8,1008,240);
  ctx.shadowColor = '#ff3ed1'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#fff2ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let size = 112;
  do {ctx.font = '900 '+size+'px Arial, sans-serif'; size -= 4;} while(ctx.measureText(text).width > 930 && size > 36);
  ctx.fillText(text,512,132);
  ctx.shadowBlur=0;
  djSignTexture.needsUpdate=true;
}

function setSong(title) {
  const songTitle = (title || 'FUNK PULSE').toUpperCase();
  const text = '♪ ' + songTitle + '  ·  ';
  document.getElementById('led1').textContent = text;
  document.getElementById('led2').textContent = text;
  wallSongTitle = songTitle;
}

function handleMsg(data) {
  if (!data || !data.type) return;
  if (data.type === 'config') setTtsKey(data.ttsKey);
  if (data.type === 'state') applyState(data);
  if (data.type === 'song') setSong(data.title);
  if (data.type === 'guest-dj') setGuestDj(data.name);
  if(data.type==='name-frames' && data.frames && typeof data.frames==='object'){nameFrames=data.frames;updateNameplates();}
  if (data.type === 'dj-label') setDjLabel(data.text);
  if (data.type === 'music') setStageMusic(data.url, data.revision);
  if (data.type === 'music-stop') setStageMusic('', data.revision);
  if (data.type === 'add') {
    const name = (data.name || '').trim();
    if (!name) return;
    if (!knownNames.has(name.toLowerCase()) && allNames.length < MAX_TOTAL) {
      allNames.push(name);
      knownNames.add(name.toLowerCase());
      rebuildVisual();
    }
    if (knownNames.has(name.toLowerCase())) showJoinToast(name);
  }
  if (data.type === 'remove') {
    const key = (data.name || '').toLowerCase();
    allNames = allNames.filter(n => n.toLowerCase() !== key);
    knownNames.delete(key);
    rebuildVisual();
  }
  if (data.type === 'clear') {
    cancelAllEntrances(); entryBurstNoZoomUntil=0;
    allNames = []; knownNames.clear(); guestDjName="";guestDjTravel=null; rebuildVisual();
  }
}

function connectRoom(code) {
  code = (code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 4) {
    document.getElementById('join-msg').textContent = 'Mã phòng không hợp lệ';
    return;
  }
  document.getElementById('join-msg').textContent = 'Đang kết nối...';
  document.getElementById('btn-join').disabled = true;
  document.getElementById('room-input').blur();

  if (peer) { try { peer.destroy(); } catch (e) {} }
  peer = new Peer({
    debug: 0,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    }
  });

  const fail = (msg) => {
    document.getElementById('join-msg').textContent = msg || 'Không kết nối được. Kiểm tra mã phòng.';
    document.getElementById('btn-join').disabled = false;
    setConnUI('Lỗi kết nối', false);
  };

  peer.on('open', () => {
    conn = peer.connect('djbar-' + code, { reliable: true });
    const timeout = setTimeout(() => fail('Hết thời gian chờ. Kiểm tra mã / Admin còn mở không?'), 12000);

    conn.on('open', () => {
      clearTimeout(timeout);
      showStageUI();
      setConnUI('Đã kết nối', true);
      if (!started) { started = true; initScene(); }
      try { conn.send({ type: 'hello' }); } catch (e) {}
      try { localStorage.setItem('djbar_stage_room', code); } catch (e) {}
    });
    conn.on('data', handleMsg);
    conn.on('close', () => setConnUI('Mất kết nối', false));
    conn.on('error', () => { clearTimeout(timeout); fail(); });
  });

  peer.on('error', err => {
    console.warn(err);
    fail('Lỗi mạng hoặc mã phòng sai');
  });
}

document.getElementById('btn-join').onclick = () => {
  unlockSpeech();
  connectRoom(document.getElementById('room-input').value);
};
document.getElementById('room-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    unlockSpeech();
    connectRoom(document.getElementById('room-input').value);
  }
});
// Auto uppercase
document.getElementById('room-input').addEventListener('input', e => {
  const el = e.target;
  const s = el.selectionStart;
  el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  el.setSelectionRange(s, s);
});

try {
  const last = localStorage.getItem('djbar_stage_room');
  if (last) document.getElementById('room-input').value = last;
} catch (e) {}

if (window.speechSynthesis) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = () => refreshVoices();
}

const btnSound = document.getElementById('btn-sound');
if (btnSound) {
  btnSound.addEventListener('click', async () => {
    btnSound.textContent = 'Đang bật...';
    speechReady = true;
    unlockSpeech();
    await new Promise(r => setTimeout(r, 800));
    await speakVietnamese('Đã bật tiếng Việt');
    btnSound.textContent = 'Đã bật 🔊';
    btnSound.classList.add('on');
  });
}

function animateChar(char, dt, energy = 1) {
  const ud = char.userData;
  ud.phase += dt * (11 * energy);
  const ph = ud.phase;
  char.position.y = Math.abs(Math.sin(ph)) * 0.12 * energy;
  ud.armL.rotation.z = 0.3 + Math.sin(ph) * 1.0 * energy;
  ud.armR.rotation.z = -0.3 - Math.sin(ph + 1.1) * 1.0 * energy;
  ud.legL.rotation.x = Math.sin(ph) * 0.4 * energy;
  ud.legR.rotation.x = -Math.sin(ph) * 0.4 * energy;
  ud.body.rotation.z = Math.sin(ph * 0.5) * 0.06 * energy;
}

function animate() {
  requestAnimationFrame(animate);
  if (!renderer || !scene) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (dj) animateChar(dj, dt, 0.45);
  if (djOperator) {
    // Nhảy theo beat: bật cao, lắc người, giơ hai tay và vẫy liên tục.
    const beat = t * 8.4;
    const jump = Math.pow(Math.max(0, Math.sin(beat)), 1.35);
    djOperator.position.y = djPlatformHeight + 1.12 + jump * 0.38;
    djOperator.position.x = Math.sin(t * 2.3) * 0.30;
    djOperator.rotation.z = Math.sin(t * 4.1) * 0.14;
    djOperator.rotation.y = Math.sin(t * 2.6) * 0.22;
    const l = djOperator.userData.leftArm, r = djOperator.userData.rightArm;
    if (l) { l.rotation.z = -1.85 + Math.sin(t * 9.2) * 0.45; l.rotation.x = Math.sin(t * 7.1) * 0.40; }
    if (r) { r.rotation.z = 1.85 - Math.sin(t * 9.2 + 1.7) * 0.45; r.rotation.x = Math.sin(t * 7.6 + 1.1) * 0.40; }
  }
  // LED cổng phát sáng theo nhịp; Equalizer chạy độc lập hai bên DJ.
  djPortalRings.forEach((ring,i) => {
    ring.mesh.material.opacity=0.38+0.57*(0.5+0.5*Math.sin(t*3.8-ring.phase));
  });
  djEqualizerBars.forEach((bar,i) => {
    const beat = Math.abs(Math.sin(t*4.8+bar.phase)*Math.cos(t*1.65+bar.phase*0.5));
    const h=0.30+beat*2.05;
    bar.mesh.scale.y=h/0.48;
    bar.mesh.position.y=bar.base+h/2;
    bar.mesh.material.color.setHex([0xff39b8,0x00eaff,0xa96aff,0xffd65c][Math.floor(t*1.9+i/3)%4]);
  });
  updateEntrance(dt,t);
  updateGuestDj(dt);
  dancers.forEach(d => {
    if(d.entering || (guestDjTravel && guestDjTravel.d===d)) {
      const ud=d.avatar.userData;
      ud.phase+=dt*11;
      const stride=Math.sin(ud.phase);
      d.avatar.position.y=Math.abs(stride)*0.055;
      ud.legL.rotation.x=stride*0.52;
      ud.legR.rotation.x=-stride*0.52;
      ud.armL.rotation.x=-stride*0.38;
      ud.armR.rotation.x=stride*0.38;
      ud.armL.rotation.z=0.25;ud.armR.rotation.z=-0.25;
    } else if(d.name.toLowerCase()===guestDjName.toLowerCase()) {
      animateChar(d.avatar,dt,1.55);
      d.mesh.position.x=2.0+Math.sin(t*2.6)*0.16;
      d.mesh.position.y=djPlatformHeight;
      d.mesh.position.z=-6.85;
      d.mesh.rotation.y=Math.sin(t*2.1)*0.20;
    } else animateChar(d.avatar,dt,1);
  });

  if (discoBall) {
    discoBall.rotation.y = t * 2.35;
    discoBall.rotation.x = Math.sin(t * 0.85) * 0.12;
  }
  // Những chấm sáng quét qua sàn khi quả cầu quay; tia sáng luôn bắt đầu từ quả cầu.
  discoRays.forEach((r,i)=>{
    const a=r.phase+t*1.35;
    const radius=3.5+(i%3)*1.35;
    const dest=new THREE.Vector3(Math.cos(a)*radius,0.085,Math.sin(a)*radius);
    // Bắt đầu ở bề mặt gương thay vì cùng một điểm giữa quả cầu.
    const surface=r.origin.clone().add(new THREE.Vector3(Math.cos(a)*0.49,-0.20,Math.sin(a)*0.49));
    const direction=dest.clone().sub(surface);
    r.ray.position.copy(surface).add(dest).multiplyScalar(0.5);
    r.ray.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.clone().normalize());
    r.ray.scale.y=direction.length();
    r.ray.material.opacity=0.022+0.035*(0.5+0.5*Math.sin(t*2.8+i));
    r.spot.position.copy(dest);
    r.spot.material.opacity=0.13+0.22*(0.5+0.5*Math.sin(t*2.2+i));
  });
  discoSpots.forEach((s, i) => {
    const ang = s.angle + t * 1.35;
    s.light.position.set(Math.cos(ang) * 4.8, 3.6 + Math.sin(t * 2 + i) * 0.9, Math.sin(ang) * 4.8);
    s.light.intensity = 0.35 + Math.sin(t * 0.85 + i) * 0.12;
  });
  // Chữ bài hát chạy ngay trên tường DJ, không có banner nổi trên màn hình.
  if (wallSongCanvas && wallSongTexture && t-lastWallSongFrame > 0.045) {
    lastWallSongFrame = t;
    const ctx = wallSongCanvas.getContext('2d');
    ctx.fillStyle = '#08080d'; ctx.fillRect(0,0,1024,160);
    ctx.fillStyle = '#15151e'; ctx.fillRect(0,0,1024,3);
    ctx.font = 'bold 82px Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff66cc'; ctx.shadowBlur = 17;
    ctx.fillStyle = '#ff66cc';
    const label = '♫  ' + wallSongTitle + '     ✦     ';
    const labelWidth = Math.max(1,ctx.measureText(label).width);
    const shift = (t * 95) % labelWidth;
    for (let x=-shift-labelWidth; x<1024+labelWidth; x+=labelWidth) ctx.fillText(label,x,84);
    ctx.shadowBlur = 0;
    wallSongTexture.needsUpdate = true;
  }
  ceilingBeams.forEach((b,i)=>{
    const pulse=0.5+0.5*Math.sin(t*6.0+b.phase);
    const dx=Math.sin(t*4.8+b.angle)*0.62;
    const dz=Math.cos(t*4.2+b.angle)*0.62;
    const end=new THREE.Vector3(b.targetX+dx,0.10,b.targetZ+dz);
    const begin=new THREE.Vector3(b.x,b.y,b.z);
    const vec=new THREE.Vector3().subVectors(end,begin);
    b.beam.position.copy(begin).add(end).multiplyScalar(0.5);
    b.beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vec.normalize());
    b.beam.material.opacity=0.12+pulse*0.17;
    b.glow.position.set(end.x,0.065,end.z);
    b.glow.material.opacity=0.07+pulse*0.14;
    b.glow.scale.setScalar(0.85+pulse*0.12);
    b.lens.material.opacity=0.60+pulse*0.18;
  });
  wallBars.forEach(q=>{
    q.mesh.material.opacity=0.22+0.19*Math.max(0,Math.sin(t*3.4+q.phase));
  });
  spotLights.forEach((s, i) => {
    const blink = 0.5 + 0.5 * Math.sin(t * 0.85 + s.phase);
    s.light.intensity = 0.30 + blink * 0.25;
    s.lens.material.color.setHSL(0.12, 1, 0.5 + blink * 0.28);
  });
  const beat = 0.5 + 0.5 * Math.sin(t * 0.70);
  neonMeshes.forEach((n, i) => {
    if (!n.mesh || !n.color) return;
    const hsl = {}; n.color.getHSL(hsl);
    n.mesh.material.color.setHSL((hsl.h + t * 0.012 + i * 0.04) % 1, 0.85, 0.46 + beat * 0.09);
  });
  floorTiles.forEach(t2 => {
    t2.mesh.material.opacity = 0.24 + 0.60 * Math.max(0, Math.sin(t * 2.25 + t2.phase * 0.5));
  });
  if (centerGlow) centerGlow.material.opacity = 0.12 + beat * 0.10;
  if (deckL) deckL.rotation.y = t * 1.8;
  if (deckR) deckR.rotation.y = -t * 2.0;
  djLedRings.forEach((r,i)=>{
    r.mesh.material.opacity=0.62+0.38*(0.5+0.5*Math.sin(t*4.6+r.phase));
    r.mesh.rotation.z=t*(i%2?2.2:-2.5);
  });
  djLedDots.forEach((d,i)=>{
    d.mesh.visible=Math.sin(t*7.2+d.phase)>-0.22;
  });
  djConsoleLights.forEach((d,i)=>{
    d.mesh.material.color.setHex(Math.sin(t*5.5+d.phase)>0?0xff66cc:0x00eaff);
  });

  // Theo chân người mới vào, sau đó trở lại toàn cảnh.
  updateEntranceCamera(dt,t);
  renderer.render(scene, camera);
}
</script>
