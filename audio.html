<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ Bar - Âm thanh Chrome</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{font:16px system-ui;background:#100c1e;color:white;max-width:640px;margin:35px auto;padding:20px}button{background:#a74aff;color:white;border:0;border-radius:12px;padding:16px;font-weight:bold;font-size:17px;cursor:pointer}p{line-height:1.6}audio{width:100%;margin-top:15px}iframe{width:100%;height:180px;border:0;margin-top:15px}#status{color:#6fffd6}</style></head><body><h1>🔊 DJ Bar - Bộ phát âm thanh</h1><p>Trang này chỉ phát âm thanh. Mở trên Chrome cùng máy với TikTok LIVE Studio, bấm kích hoạt một lần, sau đó điều khiển từ Admin như bình thường. Không cần thao tác trong màn hình Live.</p><button id="start">Kích hoạt âm thanh</button><p id="status">Chưa kích hoạt</p><p id="track"></p><audio id="music" loop controls></audio><iframe id="embed" allow="autoplay;encrypted-media" style="display:none"></iframe><script>
const ROOM='BARLIVE001',statusEl=document.getElementById('status'),music=document.getElementById('music'),embed=document.getElementById('embed');
let peer=null,admin=null,activated=false,lastRevision=-1,ttsQueue=Promise.resolve(),currentUrl='';
function status(t){statusEl.textContent=t;if(admin&&admin.open)try{admin.send({type:'audio-status',message:t})}catch(e){}}
function parseMusic(url){try{const u=new URL(url);if(!/^https?:$/.test(u.protocol))return null;const host=u.hostname.toLowerCase();if(host==='youtu.be'||host.endsWith('youtube.com')){let id=host==='youtu.be'?u.pathname.slice(1):u.searchParams.get('v');if(!id&&u.pathname.startsWith('/shorts/'))id=u.pathname.split('/')[2];if(id&&/^[a-zA-Z0-9_-]{11}$/.test(id))return {type:'embed',src:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1'};}if(host==='soundcloud.com'||host.endsWith('.soundcloud.com'))return {type:'embed',src:'https://w.soundcloud.com/player/?url='+encodeURIComponent(url)+'&auto_play=true'};return {type:'audio',src:url};}catch(e){return null}}
function stop(){music.pause();music.removeAttribute('src');embed.src='about:blank';embed.style.display='none';currentUrl='';}
async function play(url,rev){if(rev!=null&&rev===lastRevision&&url===currentUrl)return;lastRevision=rev??lastRevision;stop();if(!url)return;currentUrl=url;document.getElementById('track').textContent='Nhạc: '+url;const p=parseMusic(url);if(!p){status('Link nhạc không hợp lệ');return;}if(p.type==='audio'){music.src=p.src;try{await music.play();status('Đang phát nhạc');}catch(e){status('Không tự phát được: '+e.message);}}else{embed.style.display='block';embed.src=p.src;status('Đã tải player; YouTube/SoundCloud có thể yêu cầu thao tác riêng');}}
function speak(name){name=String(name||'').trim();if(!name)return;ttsQueue=ttsQueue.then(async()=>{const text=name+' đã vào sàn nhảy';let success=false;const urls=['https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(text)];for(const url of urls){if(success)break;success=await new Promise(resolve=>{const a=new Audio(url);a.onended=()=>resolve(true);a.onerror=()=>resolve(false);a.play().catch(()=>resolve(false));setTimeout(()=>resolve(false),12000)});}if(!success&&window.speechSynthesis){const voices=speechSynthesis.getVoices();const vi=voices.find(v=>/^vi([-_]|$)/i.test(v.lang||''));if(vi)await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(text);u.voice=vi;u.lang='vi-VN';u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);setTimeout(resolve,12000)});}}).catch(()=>{});}
function receive(d){if(!d||!d.type)return;if(d.type==='state'){if(d.musicUrl)play(d.musicUrl,d.musicRevision);else if(currentUrl)stop();}if(d.type==='music')play(d.url,d.revision);if(d.type==='music-stop')stop();if(d.type==='add')speak(d.name);}
function startHost(){if(peer&&!peer.destroyed)return;status('Đang mở phòng âm thanh...');peer=new Peer('djbar-audio-'+ROOM,{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});peer.on('open',()=>status('Sẵn sàng - chờ Admin kết nối'));peer.on('connection',c=>{c.on('open',()=>{if(admin&&admin!==c)try{admin.close()}catch(e){}admin=c;status('Đã kết nối Admin');c.send({type:'audio-status',message:'Đã kết nối'});});c.on('data',receive);c.on('close',()=>{if(admin===c){admin=null;status('Admin ngắt - đang chờ kết nối lại')}});});peer.on('disconnected',()=>{status('Mất tín hiệu - đang kết nối lại');try{peer.reconnect()}catch(e){}});peer.on('error',e=>{status('Lỗi kết nối: '+e.type);if(e.type!=='unavailable-id'){try{peer.destroy()}catch(x){}peer=null;setTimeout(startHost,5000)}});}
document.getElementById('start').onclick=async()=>{activated=true;try{const a=new Audio();a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';await a.play().catch(()=>{});}catch(e){}if(window.speechSynthesis)speechSynthesis.getVoices();startHost();};
</script></body></html>
